name: Build PicoOS image

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bc build-essential ccache curl file libncurses-dev \
            python3 rsync unzip wget

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: dl/
          key: ${{ runner.os }}-buildroot-2026.05.3-${{ hashFiles('Makefile', 'br2-external/**', 'scripts/bootstrap-buildroot.sh') }}

      - name: Cache compiler
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/picoos-ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('Makefile', 'br2-external/**', 'scripts/bootstrap-buildroot.sh') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure
        run: |
          make configure \
            OUTPUT_DIR=output \
            DOWNLOAD_DIR=dl \
            CCACHE_DIR="${RUNNER_TEMP}/picoos-ccache"

      - name: Build image
        run: |
          make -j2 build \
            OUTPUT_DIR=output \
            DOWNLOAD_DIR=dl \
            CCACHE_DIR="${RUNNER_TEMP}/picoos-ccache"

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: picoos-zero2w-image
          path: output/images/*
          if-no-files-found: error
          retention-days: 14
