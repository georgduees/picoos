image boot.vfat {
	vfat {
		files = {
			"bcm2710-rpi-zero-2-w.dtb",
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/config.txt",
			"rpi-firmware/fixup.dat",
			"rpi-firmware/overlays",
			"rpi-firmware/start.elf",
			"zImage"
		}
	}
	size = 32M
}

image sdcard.img {
	hdimage {}
	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}
	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
	partition data {
		partition-type = 0xC
		image = "data.vfat"
	}
}
