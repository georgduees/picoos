image boot.vfat {
	vfat {
		extraargs = "-F 32"
		files = {
			"bcm2710-rpi-zero-2-w.dtb",
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/config.txt",
			"rpi-firmware/fixup.dat",
			"rpi-firmware/overlays",
			"rpi-firmware/start.elf",
			"u-boot.bin"
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {}
	partition environment {
		in-partition-table = "no"
		offset = 256K
		size = 64K
		image = "uboot-env.bin"
	}
	partition environment-redundant {
		in-partition-table = "no"
		offset = 384K
		size = 64K
		image = "uboot-env.bin"
	}
	partition boot {
		offset = 1M
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}
	partition system-a {
		offset = 65M
		size = 512M
		partition-type = 0x83
		image = "rootfs.ext4"
	}
	partition system-b {
		offset = 577M
		size = 512M
		partition-type = 0x83
		image = "rootfs.ext4"
	}
	partition data {
		offset = 1089M
		size = 1024M
		partition-type = 0xC
		image = "data.vfat"
	}
}
